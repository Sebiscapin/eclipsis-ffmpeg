name: Compila FFmpeg per Eclipsis

on:
  workflow_dispatch:
  push:
    # ogni modifica a main si compila e si prova; la release si crea solo con un tag v...
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  compila:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Compila (Docker, immagine di BtbN)
        run: |
          set -o pipefail
          bash compila.sh 2>&1 | tee compilazione.log
      # se la compilazione fallisce, le righe d'errore diventano annotazioni: si leggono
      # anche senza accesso al repository (il registro completo no)
      - name: Errori della compilazione in evidenza
        if: failure()
        run: |
          grep -n -E "error:|Error [0-9]|\*\*\*|ERRORE|No such file|not found|unbound variable" \
            compilazione.log | tail -n 10 | while IFS= read -r riga; do
            echo "::error title=compilazione::${riga:0:900}"
          done
          # GitHub tiene al massimo 10 annotazioni d'errore e 10 d'avviso per passo
          tail -n 10 compilazione.log | while IFS= read -r riga; do
            echo "::warning title=ultime righe::${riga:0:900}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: uscita/
          if-no-files-found: error

  prova:
    needs: compila
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: eclipsis
      - name: Media Foundation (su Windows Server e' una funzionalita' da aggiungere)
        shell: pwsh
        run: |
          $f = Get-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue
          if ($f -and -not $f.Installed) {
            $r = Install-WindowsFeature Server-Media-Foundation
            $r | Format-List
            "::notice title=Media Foundation::installata adesso: Success=$($r.Success), RestartNeeded=$($r.RestartNeeded), ExitCode=$($r.ExitCode)"
          } elseif ($f) {
            "::notice title=Media Foundation::gia' presente"
          } else {
            "::notice title=Media Foundation::Get-WindowsFeature non disponibile su questa macchina"
          }
          Get-ChildItem C:\Windows\System32\msauddecmft.dll, C:\Windows\System32\mfplat.dll
          # aac_mf crea il decoder di Windows dal suo CLSID: deve essere registrato
          $clsid = 'Registry::HKEY_CLASSES_ROOT\CLSID\{32d186a7-218f-4c75-8876-dd77273a8999}\InprocServer32'
          if (Test-Path $clsid) {
            "::notice title=decoder AAC di Windows::registrato in $((Get-ItemProperty $clsid).'(default)')"
          } else {
            "::warning title=decoder AAC di Windows::CLSID non registrato (serve un riavvio?)"
          }
      - name: FFmpeg ufficiale di BtbN (riferimento col decoder AAC di FFmpeg)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ufficiale.zip
          Expand-Archive ufficiale.zip -DestinationPath ufficiale
          $exe = Get-ChildItem ufficiale -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "UFFICIALE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Elenco dei componenti
        shell: pwsh
        run: |
          .\eclipsis\ffmpeg.exe -hide_banner -version
          .\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String " aac"
          .\eclipsis\ffmpeg.exe -hide_banner -encoders
          if (.\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String "^ A....D aac  ") { throw "c'e' ancora il decoder AAC di FFmpeg" }
      - name: File di prova
        shell: pwsh
        run: |
          New-Item -ItemType Directory prova | Out-Null
          # -aac_pns 0: col rumore sostituito (PNS) ogni decoder genera il suo rumore e i due
          # risultati non si potrebbero confrontare
          # (stereo_44k.aac e' ADTS: senza intestazione MP4, come i .aac e gli MPEG-TS)
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=440:sample_rate=48000:d=6" -f lavfi -i "sine=frequency=660:sample_rate=48000:d=6" -filter_complex "[0][1]amerge=inputs=2" -c:a aac -aac_pns 0 -b:a 160k prova\stereo_48k.m4a
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=330:sample_rate=44100:d=5" -ac 1 -c:a aac -aac_pns 0 -b:a 96k prova\mono_44k.m4a
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=550:sample_rate=44100:d=5" -ac 2 -c:a aac -aac_pns 0 -b:a 128k prova\stereo_44k.aac
          & $env:UFFICIALE -v error -f lavfi -i "anoisesrc=d=4:c=pink:r=48000:a=0.3" -af "aformat=channel_layouts=5.1" -c:a aac -aac_pns 0 -b:a 384k prova\surround_51.m4a
          & $env:UFFICIALE -v error -f lavfi -i "testsrc2=s=320x240:r=30:d=4" -f lavfi -i "sine=frequency=500:sample_rate=48000:d=4" -c:v mpeg4 -c:a aac -aac_pns 0 -b:a 128k -shortest prova\video.mp4
          Get-ChildItem prova
          # un file mancante farebbe passare il confronto senza averlo fatto
          $n = (Get-ChildItem prova -File).Count
          if ($n -ne 5) {
            "::error title=file di prova::creati $n file su 5"
            exit 1
          }
      - name: Confronto delle decodifiche
        shell: pwsh
        run: |
          python prove\confronta_aac.py $env:UFFICIALE .\eclipsis\ffmpeg.exe (Get-ChildItem prova -File | ForEach-Object FullName)
      - name: Codifica con gli encoder di Windows (come fa il programma)
        # anche se il confronto e' fallito: due esiti in un giro solo
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # un comando che fallisce lascia le sue ultime righe come annotazioni (leggibili
          # anche senza accesso al repository)
          function Esegui([string]$nome, [string[]]$comando) {
            $uscita = & $comando[0] $comando[1..($comando.Count - 1)] 2>&1 | Out-String
            Write-Output $uscita
            if ($LASTEXITCODE -ne 0) {
              ($uscita -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 10) |
                ForEach-Object { "::error title=$nome::$($_.Trim())" }
              exit 1
            }
          }
          Esegui "codifica" @('.\eclipsis\ffmpeg.exe', '-v', 'error', '-f', 'lavfi', '-i', 'testsrc2=s=640x360:r=30:d=3', '-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=48000:d=3', '-c:v', 'h264_mf', '-hw_encoding', '0', '-pix_fmt', 'yuv420p', '-c:a', 'aac_mf', '-b:a', '192k', '-shortest', 'prova\uscita_mf.mp4')
          Esegui "lettura" @('.\eclipsis\ffprobe.exe', '-v', 'error', '-show_entries', 'stream=codec_name,sample_rate,channels', '-of', 'compact', 'prova\uscita_mf.mp4')
          Esegui "rilettura" @('.\eclipsis\ffmpeg.exe', '-v', 'error', '-i', 'prova\uscita_mf.mp4', '-f', 'null', '-')
          "::notice title=codifica::h264_mf e aac_mf: file scritto e riletto senza errori"

  pubblica:
    needs: [compila, prova]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: uscita
      - name: Release con gli eseguibili e il sorgente corrispondente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd uscita
          zip -9 ffmpeg-eclipsis-win64.zip ffmpeg.exe ffprobe.exe ffplay.exe LICENSE.txt SHA256SUMS.txt configurazione.txt commit_ffmpeg.txt immagine_docker.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "FFmpeg per Eclipsis $GITHUB_REF_NAME" \
            --notes "Eseguibili di FFmpeg compilati da questo repository (LGPL 3) e il loro sorgente corrispondente." \
            ffmpeg-eclipsis-win64.zip ffmpeg-sorgente.tar.gz
