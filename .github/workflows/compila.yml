name: Compila FFmpeg per Eclipsis

on:
  workflow_dispatch:
  push:
    # ogni modifica a main si compila e si prova; la release si crea solo con un tag v...
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  compila:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # immagine (per impronta) e commit di FFmpeg-Builds: immagine.txt. compila.sh raccoglie
      # anche licenze e sorgente di ogni libreria (raccogli_librerie.py) e si ferma se
      # immagine, commit ed eseguibili non corrispondono
      - name: Compila (Docker, immagine di FFmpeg-Builds)
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -o pipefail
          bash compila.sh 2>&1 | tee compilazione.log
      # se la compilazione fallisce, le righe d'errore diventano annotazioni: si leggono
      # anche senza accesso al repository (il registro completo no)
      - name: Errori della compilazione in evidenza
        if: failure()
        run: |
          grep -n -E "error:|Error:|Error [0-9]|\*\*\*|ERRORE|No such file|not found|unbound variable|manifest unknown" \
            compilazione.log | tail -n 10 | while IFS= read -r riga; do
            echo "::error title=compilazione::${riga:0:900}"
          done
          # GitHub tiene al massimo 10 annotazioni d'errore e 10 d'avviso per passo
          tail -n 10 compilazione.log | while IFS= read -r riga; do
            echo "::warning title=ultime righe::${riga:0:900}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: uscita/
          if-no-files-found: error

  prova:
    needs: compila
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: eclipsis
      - name: Media Foundation (su Windows Server e' una funzionalita' da aggiungere)
        shell: pwsh
        run: |
          $f = Get-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue
          if ($f -and -not $f.Installed) {
            $r = Install-WindowsFeature Server-Media-Foundation
            $r | Format-List
            "::notice title=Media Foundation::installata adesso: Success=$($r.Success), RestartNeeded=$($r.RestartNeeded), ExitCode=$($r.ExitCode)"
          } elseif ($f) {
            "::notice title=Media Foundation::gia' presente"
          } else {
            "::notice title=Media Foundation::Get-WindowsFeature non disponibile su questa macchina"
          }
          Get-ChildItem C:\Windows\System32\msauddecmft.dll, C:\Windows\System32\mfplat.dll
          # aac_mf crea il decoder di Windows dal suo CLSID: deve essere registrato
          $clsid = 'Registry::HKEY_CLASSES_ROOT\CLSID\{32d186a7-218f-4c75-8876-dd77273a8999}\InprocServer32'
          if (Test-Path $clsid) {
            "::notice title=decoder AAC di Windows::registrato in $((Get-ItemProperty $clsid).'(default)')"
          } else {
            "::warning title=decoder AAC di Windows::CLSID non registrato (serve un riavvio?)"
          }
          # h264_mf crea il decoder H.264 di Windows (msmpeg2vdec.dll) dal suo CLSID
          Get-ChildItem C:\Windows\System32\msmpeg2vdec.dll -ErrorAction SilentlyContinue
          $clsid = 'Registry::HKEY_CLASSES_ROOT\CLSID\{62CE7E72-4C71-4D20-B15D-452831A87D9D}\InprocServer32'
          if (Test-Path $clsid) {
            "::notice title=decoder H.264 di Windows::registrato in $((Get-ItemProperty $clsid).'(default)')"
          } else {
            "::warning title=decoder H.264 di Windows::CLSID non registrato (serve un riavvio?)"
          }
      - name: FFmpeg ufficiale di FFmpeg-Builds (riferimento col decoder AAC di FFmpeg)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ufficiale.zip
          Expand-Archive ufficiale.zip -DestinationPath ufficiale
          $exe = Get-ChildItem ufficiale -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "UFFICIALE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Elenco dei componenti
        shell: pwsh
        run: |
          .\eclipsis\ffmpeg.exe -hide_banner -version
          .\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String " aac"
          .\eclipsis\ffmpeg.exe -hide_banner -encoders
          if (.\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String "^ A....D aac  ") { throw "c'e' ancora il decoder AAC di FFmpeg" }
          .\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String "h264"
          if (.\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String "^ V....D h264  ") { throw "c'e' ancora il decoder H.264 di FFmpeg" }
          if (-not (.\eclipsis\ffmpeg.exe -hide_banner -decoders | Select-String "^ V....D h264_mf ")) { throw "manca il decoder h264_mf" }
      - name: File di prova
        shell: pwsh
        run: |
          New-Item -ItemType Directory prova | Out-Null
          # -aac_pns 0: col rumore sostituito (PNS) ogni decoder genera il suo rumore e i due
          # risultati non si potrebbero confrontare
          # (stereo_44k.aac e' ADTS: senza intestazione MP4, come i .aac e gli MPEG-TS)
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=440:sample_rate=48000:d=6" -f lavfi -i "sine=frequency=660:sample_rate=48000:d=6" -filter_complex "[0][1]amerge=inputs=2" -c:a aac -aac_pns 0 -b:a 160k prova\stereo_48k.m4a
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=330:sample_rate=44100:d=5" -ac 1 -c:a aac -aac_pns 0 -b:a 96k prova\mono_44k.m4a
          & $env:UFFICIALE -v error -f lavfi -i "sine=frequency=550:sample_rate=44100:d=5" -ac 2 -c:a aac -aac_pns 0 -b:a 128k prova\stereo_44k.aac
          & $env:UFFICIALE -v error -f lavfi -i "anoisesrc=d=4:c=pink:r=48000:a=0.3" -af "aformat=channel_layouts=5.1" -c:a aac -aac_pns 0 -b:a 384k prova\surround_51.m4a
          & $env:UFFICIALE -v error -f lavfi -i "testsrc2=s=320x240:r=30:d=4" -f lavfi -i "sine=frequency=500:sample_rate=48000:d=4" -c:v mpeg4 -c:a aac -aac_pns 0 -b:a 128k -shortest prova\video.mp4
          Get-ChildItem prova
          # un file mancante farebbe passare il confronto senza averlo fatto
          $n = (Get-ChildItem prova -File).Count
          if ($n -ne 5) {
            "::error title=file di prova::creati $n file su 5"
            exit 1
          }
      - name: Confronto delle decodifiche
        shell: pwsh
        run: |
          python prove\confronta_aac.py $env:UFFICIALE .\eclipsis\ffmpeg.exe (Get-ChildItem prova -File | ForEach-Object FullName)
      - name: File di prova H.264
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory prova_h264 | Out-Null
          # codificati dall'encoder H.264 di Windows della nostra build (codificare non
          # passa dal decoder); i derivati li fa l'FFmpeg ufficiale, che non dipende da h264_mf
          $e = '.\eclipsis\ffmpeg.exe'
          # 1080p (altezza codificata 1088: il ritaglio), profilo High, B-frame: h264_mf legge
          # il profilo generico di libavcodec, che vuole il numero (100 = High): «high» non
          # lo capisce, l'encoder non partiva e con hd.mp4 mancavano anche i tre derivati
          & $e -v error -f lavfi -i "testsrc2=s=1920x1080:r=30:d=4" -c:v h264_mf -hw_encoding 0 -profile:v 100 -bf 2 -g 30 -b:v 6M -pix_fmt yuv420p prova_h264\hd.mp4
          # verticale 1080x1920 (larghezza codificata 1088: il ritaglio a destra), 60 fps, MOV
          & $e -v error -f lavfi -i "testsrc2=s=1080x1920:r=60:d=3" -c:v h264_mf -hw_encoding 0 -g 60 -b:v 8M -pix_fmt yuv420p prova_h264\verticale.mov
          # due dimensioni nello stesso flusso grezzo: il cambio di formato a meta'
          & $e -v error -f lavfi -i "testsrc2=s=640x360:r=30:d=2" -c:v h264_mf -hw_encoding 0 -g 30 -pix_fmt yuv420p -f h264 prova_h264\parte1.tmp
          & $e -v error -f lavfi -i "testsrc2=s=1280x720:r=30:d=2" -c:v h264_mf -hw_encoding 0 -g 30 -pix_fmt yuv420p -f h264 prova_h264\parte2.tmp
          [IO.File]::WriteAllBytes("$PWD\prova_h264\cambio.h264", [byte[]]([IO.File]::ReadAllBytes("$PWD\prova_h264\parte1.tmp") + [IO.File]::ReadAllBytes("$PWD\prova_h264\parte2.tmp")))
          Remove-Item prova_h264\*.tmp
          # gamma piena e BT.601 scritti nel VUI (yuvj420p col decoder di FFmpeg)
          & $env:UFFICIALE -v error -i prova_h264\hd.mp4 -c copy -bsf:v "h264_metadata=video_full_range_flag=1:colour_primaries=6:transfer_characteristics=6:matrix_coefficients=6" prova_h264\piena.mp4
          # Annex B nel file grezzo e in MPEG-TS (senza h264_mp4toannexb nel decoder)
          & $env:UFFICIALE -v error -i prova_h264\hd.mp4 -c copy -bsf:v h264_mp4toannexb -f h264 prova_h264\annexb.h264
          & $env:UFFICIALE -v error -i prova_h264\hd.mp4 -c copy -f mpegts prova_h264\flusso.ts
          Get-ChildItem prova_h264
          $n = (Get-ChildItem prova_h264 -File).Count
          if ($n -ne 6) {
            "::error title=file di prova H.264::creati $n file su 6"
            exit 1
          }
          # le opzioni di ffprobe vanno a ffprobe (accanto all'ffmpeg ufficiale), non a ffmpeg
          $probe = Join-Path (Split-Path $env:UFFICIALE) 'ffprobe.exe'
          & $probe -v error -select_streams v:0 -show_entries stream=has_b_frames,profile -of compact prova_h264\hd.mp4
          $ritardo = & $probe -v error -select_streams v:0 -show_entries stream=has_b_frames -of csv=p=0 prova_h264\hd.mp4
          # senza B-frame o senza gamma piena il confronto non proverebbe il riordino e yuvj420p
          $b = @(& $probe -v error -select_streams v:0 -show_entries frame=pict_type -of csv=p=0 prova_h264\hd.mp4 | Where-Object { $_ -like 'B*' }).Count
          $gamma = & $probe -v error -select_streams v:0 -read_intervals "%+#1" -show_entries frame=pix_fmt,color_range -of csv=p=0 prova_h264\piena.mp4
          "B-frame in hd.mp4: $b (has_b_frames $ritardo); primo fotogramma di piena.mp4: $gamma"
          # senza B-frame il confronto passerebbe senza aver provato il riordino: la prova fallisce
          if ($b -eq 0 -or [int]("$ritardo".Trim()) -le 0) {
            "::error title=file di prova H.264::hd.mp4 senza B-frame ($b B-frame, has_b_frames $ritardo): il riordino non si proverebbe"
            exit 1
          }
          if ("$gamma" -notmatch 'pc') {
            "::error title=file di prova H.264::piena.mp4 non e' a gamma piena ($gamma)"
            exit 1
          }
      - name: Confronto delle decodifiche H.264 (framemd5, ricerca, ffprobe)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python prove\confronta_h264.py $env:UFFICIALE .\eclipsis\ffmpeg.exe --ss 1.3 (Get-ChildItem prova_h264 -File | ForEach-Object FullName)
      - name: Codifica con gli encoder di Windows (come fa il programma)
        # anche se il confronto e' fallito: due esiti in un giro solo
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # un comando che fallisce lascia le sue ultime righe come annotazioni (leggibili
          # anche senza accesso al repository)
          function Esegui([string]$nome, [string[]]$comando) {
            $uscita = & $comando[0] $comando[1..($comando.Count - 1)] 2>&1 | Out-String
            Write-Output $uscita
            if ($LASTEXITCODE -ne 0) {
              ($uscita -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 10) |
                ForEach-Object { "::error title=$nome::$($_.Trim())" }
              exit 1
            }
          }
          Esegui "codifica" @('.\eclipsis\ffmpeg.exe', '-v', 'error', '-f', 'lavfi', '-i', 'testsrc2=s=640x360:r=30:d=3', '-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=48000:d=3', '-c:v', 'h264_mf', '-hw_encoding', '0', '-pix_fmt', 'yuv420p', '-c:a', 'aac_mf', '-b:a', '192k', '-shortest', 'prova\uscita_mf.mp4')
          Esegui "lettura" @('.\eclipsis\ffprobe.exe', '-v', 'error', '-show_entries', 'stream=codec_name,sample_rate,channels', '-of', 'compact', 'prova\uscita_mf.mp4')
          Esegui "rilettura" @('.\eclipsis\ffmpeg.exe', '-v', 'error', '-i', 'prova\uscita_mf.mp4', '-f', 'null', '-')
          "::notice title=codifica::h264_mf e aac_mf: file scritto e riletto senza errori"

  pubblica:
    needs: [compila, prova]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-eclipsis-win64
          path: uscita
      - name: Release con gli eseguibili, le licenze e il sorgente corrispondente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd uscita
          # accanto agli eseguibili: LGPL 3 e la GPL 3 a cui rimanda, l'avviso delle modifiche
          # e licenze/ (licenza e avvisi di ogni libreria collegata, librerie.json)
          zip -9 -r ffmpeg-eclipsis-win64.zip ffmpeg.exe ffprobe.exe ffplay.exe LICENSE.txt \
            COPYING.GPLv3.txt MODIFICHE_ECLIPSIS.txt licenze SHA256SUMS.txt configurazione.txt \
            commit_ffmpeg.txt immagine_docker.txt versioni_immagine.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "FFmpeg per Eclipsis $GITHUB_REF_NAME" \
            --notes "Eseguibili di FFmpeg compilati da questo repository (LGPL 3), con le licenze di ogni componente (cartella licenze dello zip). Sorgente corrispondente: ffmpeg-sorgente.tar.gz (FFmpeg con i decoder aac_mf e h264_mf) e librerie-sorgente.tar (ogni libreria collegata, FriBidi e libiconv comprese, ai commit esatti, con gli script di compilazione)." \
            ffmpeg-eclipsis-win64.zip ffmpeg-sorgente.tar.gz librerie-sorgente.tar
